<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Côte Tennis</title>
    <meta
      name="description"
      content="Trouvez un partenaire de tennis près de Nice. Publiez votre dispo et jouez."
    />
    <style>
      :root {
        --ink: #0b1f17;
        --canvas: #f4f7f2;
        --lime: #c8f031;
        --muted: #5a6b62;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(120% 80% at 10% 0%, #d9f99d 0%, var(--canvas) 45%, #e8efe6 100%);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 28rem;
        width: 100%;
      }
      h1 {
        font-size: clamp(2.5rem, 8vw, 3.5rem);
        line-height: 0.95;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      a.cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        background: var(--lime);
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Côte Tennis</h1>
      <p>
        Matchmaking tennis sur la Côte d’Azur. Ouvrez un lien d’invitation Free pour voir une
        dispo et dire « Ça m’intéresse ».
      </p>
      <a class="cta" href="https://apps.apple.com/">Obtenir l’app</a>
    </main>
  </body>
</html>
